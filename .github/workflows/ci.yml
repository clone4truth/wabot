name: CI

# CI hanya untuk pull request & manual — push ke main ditangani CD
# (job quality-nya menjalankan gate yang sama), agar tidak ada
# dua workflow yang menguji commit yang sama dua kali.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Push cepat beruntun ke satu PR: batalkan run lama yang sudah usang.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Typecheck · Build · Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install dashboard dependencies
        run: npm ci --prefix dashboard

      - name: Build dashboard
        run: npm run dashboard:build

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install ffmpeg (test dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fontconfig fonts-dejavu-core

      - name: Tests
        run: npm test

  docker:
    name: Docker build gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wabot:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
