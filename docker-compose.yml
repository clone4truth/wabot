services:
  sticker-bot:
    build: .
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - WAHA_BASE_URL=http://localhost:3001
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_SESSION=${WAHA_SESSION}
      - WAHA_WEBHOOK_HMAC_KEY=${WAHA_WEBHOOK_HMAC_KEY}
      - APP_ENV=production
      - LOG_LEVEL=warn
    restart: unless-stopped
