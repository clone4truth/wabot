services:
  sticker-bot:
    build: .
    ports:
      - "3001:3000"
    environment:
      - WAHA_BASE_URL=${WAHA_BASE_URL}
      - WAHA_API_KEY=${WAHA_API_KEY}
      - WAHA_SESSION=${WAHA_SESSION}
      - WAHA_WEBHOOK_HMAC_KEY=${WAHA_WEBHOOK_HMAC_KEY}
      - APP_ENV=production
      - LOG_LEVEL=warn
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped
